<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>MDCU Recorded Lecture</title>

  <base href="/"/>

  <!-- Paint the saved theme before Angular boots. Key matches APPLIED_THEME_KEY in theme.service.ts. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = JSON.parse(localStorage.getItem('flickThemeApplied') || 'null');
        if (saved && saved.scheme) {
          root.setAttribute('data-theme', saved.scheme);
          var variables = saved.variables || {};
          Object.keys(variables).forEach(function (name) {
            root.style.setProperty(name, variables[name]);
          });
          return;
        }
      } catch (error) {
        // No usable saved theme; fall back to the system preference.
      }
      root.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>

  <!-- Firebase refreshes and checks the saved sign-in, then the page asks FlickMan for its data: connect while the app downloads -->
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin/>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin/>
  <link rel="preconnect" href="https://flick-man-app.docchula.com" crossorigin/>

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>

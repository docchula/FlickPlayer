<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>MDCU Recorded Lecture</title>

  <base href="/"/>

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">

  <!-- Apply saved settings before Angular boots. Keys match settings.service.ts. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = JSON.parse(localStorage.getItem('flickSettings') || 'null');
        if (saved && saved.hidden && saved.hidden.length) {
          root.setAttribute('data-hidden', saved.hidden.join(' '));
        }
      } catch (error) {
        // No usable saved settings; everything stays visible.
      }
      try {
        var font = JSON.parse(localStorage.getItem('flickFontApplied') || 'null');
        if (font && font.stack) {
          root.style.setProperty('--ion-font-family', font.stack);
          root.style.setProperty('--flick-font-scale', String(font.scale || 1));
        }
        if (font && font.href) {
          var link = document.createElement('link');
          link.id = 'flick-font-' + font.id;
          link.rel = 'stylesheet';
          link.href = font.href;
          document.head.appendChild(link);
        }
      } catch (error) {
        // No usable saved font; the default stack applies.
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>

<ion-button fill="clear" [id]="triggerId" aria-label="Change appearance">
    <ion-icon slot="icon-only" [name]="(themeService.modeOption$ | async)?.icon"></ion-icon>
</ion-button>

<ion-popover [trigger]="triggerId" [dismissOnSelect]="true" side="bottom" alignment="end">
    <ng-template>
        <ion-list lines="none" class="mode-list">
            @for (option of themeService.modes; track option.value) {
                <ion-item button detail="false" (click)="select(option.value)"
                          [class.selected]="option.value === (themeService.mode$ | async)">
                    <ion-icon [name]="option.icon" slot="start" class="mode-icon"></ion-icon>
                    <ion-label>
                        <h3>{{ option.label }}</h3>
                        <p>{{ option.description }}</p>
                    </ion-label>
                    @if (option.value === (themeService.mode$ | async)) {
                        <ion-icon name="checkmark" slot="end" color="primary"></ion-icon>
                    }
                </ion-item>
            }
        </ion-list>
    </ng-template>
</ion-popover>

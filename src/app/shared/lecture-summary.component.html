@if (view$ | async; as view) {
    @if (shows(view)) {
        <ion-card class="study-card">
            <div class="card-head">
                <button type="button" class="card-toggle" (click)="toggle()" [attr.aria-expanded]="!collapsed">
                    <span class="card-heading">
                        <span class="card-title">Summary</span>
                        @if (view.summary && isAiDraft(view.summary)) {
                            <span class="card-badge">AI draft</span>
                        }
                    </span>
                    @if (view.points) {
                        <span class="card-meta">{{ view.reviewed }}/{{ view.points }} ticked</span>
                    }
                    <ion-icon class="collapse-icon" [name]="collapsed ? 'chevron-down' : 'chevron-up'" aria-hidden="true"></ion-icon>
                </button>
                @if (view.aids) {
                    <button type="button" class="card-expand" (click)="read(view)" title="Reading mode"
                            aria-label="Open the summary and quiz in a large window">
                        <ion-icon name="expand-outline" aria-hidden="true"></ion-icon>
                    </button>
                }
            </div>

            @if (!collapsed) {
                <div class="card-body">
                    @if (view.status === 'loading') {
                        <div class="card-loading">
                            <ion-spinner name="dots" aria-label="Loading the summary"></ion-spinner>
                        </div>
                    } @else if (view.status === 'error') {
                        <p class="card-note">The summary could not be loaded.</p>
                        <ion-button class="small-button" size="small" fill="outline" (click)="retry(view)">Try again</ion-button>
                    } @else if (view.aids) {
                        <app-summary-body [aids]="view.aids" [playback]="playback" (seek)="seek($event)"></app-summary-body>
                    }
                </div>
            }
        </ion-card>
    }
}

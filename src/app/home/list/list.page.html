<ion-header>
  <ion-toolbar>
    <ion-back-button slot="start" defaultHref="/home"></ion-back-button>
    <ion-title>
      <span [ngStyle]="{'background-color': getYearColor()}">{{ year || 'Loading'}}</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="togglePink()" [attr.aria-label]="(themeService.isPinkMode$ | async) ? 'Disable pink theme' : 'Enable pink theme'">
        <ion-icon [name]="(themeService.isPinkMode$ | async) ? 'heart' : 'heart-outline'" [color]="(themeService.isPinkMode$ | async) ? 'danger' : 'medium'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
    @if (list$ | async; as list) {
        @if (list) {
            <ion-list>
                @for (course of list; track course.id) {
                    <ion-item button [routerLink]="course.link">
                        <ion-label>
                            @if (course.is_remote) {
                                <span class="e-learning-tag">MDCU <small>E-Learning</small></span>
                            }
                            {{ course.name }}
                        </ion-label>
                    </ion-item>
                }
            </ion-list>
        } @else {
            <p>Empty.</p>
        }
    }
</ion-content>
